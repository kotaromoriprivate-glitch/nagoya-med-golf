<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c30"><title>ゴルフ部 配車・会計 プレビュー</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6f4;color:#163b30;margin:0;padding:0 14px 100px}header{background:#123c30;color:white;margin:0 -14px;padding:25px 18px 18px}h1{font-size:21px;margin:0}header p{margin:6px 0 0;font-size:12px;opacity:.8}.notice{background:#fff4dc;border:1px solid #efc96b;border-radius:12px;padding:12px;margin:14px 0;font-size:13px}.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{flex:1}button,input,select{font:inherit;border-radius:10px;border:1px solid #cad8d0;padding:12px;box-sizing:border-box}button{background:white;color:#123c30;font-weight:600}button.active,.primary{background:#17664c;color:white;border-color:#17664c}button:disabled{opacity:.4}.card{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #dce5df}label{display:block;font-size:13px;margin:12px 0 5px}input,select{width:100%;background:white}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.pill{display:inline-block;background:#e8f1ec;border-radius:99px;padding:6px 9px;margin:3px;font-size:13px}.hidden{display:none}.muted{color:#63766c;font-size:13px}.big{font-size:25px;font-weight:700}.assignment{border-top:1px solid #e4ebe7;padding:12px 0}.remove{color:#a43232}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:8px 0;font-size:13px;text-align:center;border:1px solid #e3eae5;border-radius:8px}.day.mark{background:#e4f4e9;border-color:#94c9a6}.day.selected{background:#17664c;color:white}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 5px;border-bottom:1px solid #edf0ee;text-align:left}td:last-child,th:last-child{text-align:right}</style></head><body><header><h1>名大医学部ゴルフ部</h1><p>配車・会計 管理サイト｜スマホ操作プレビュー</p></header><div class="notice">⚠️ これは公開操作確認用のデモです。実名・交通費などの個人情報を入力しないでください。保存はこの端末のブラウザ内のみで、部員間では共有されません。</div><div class="tabs"><button class="active" data-tab="calendar">予定</button><button data-tab="rides">配車</button><button data-tab="summary">集計</button></div><section id="calendar"><div class="card"><h3>カレンダー</h3><div class="row"><button id="prev">‹</button><strong id="monthLabel" style="text-align:center"></strong><button id="next">›</button></div><div class="calendar" id="cal"></div><p class="muted">日付をタップすると、その日の配車を編集できます。</p></div></section><section id="rides" class="hidden"><div class="card"><h3>配車表を登録</h3><label>日付</label><input type="date" id="date"><label>区分</label><div class="row"><button id="out" class="active">行き</button><button id="back">帰り</button></div><label>運転者（デモ名簿から検索）</label><input id="driverQuery" placeholder="例：山田"><div id="driverMatches"></div><label>乗車者（複数選択）</label><input id="passengerQuery" placeholder="例：佐藤"><div id="passengerMatches"></div><div id="selectedPassengers"></div><button class="primary" id="add" style="width:100%;margin-top:12px">この車を登録</button></div><div class="card"><h3>登録済み配車</h3><div id="assignments"></div></div></section><section id="summary" class="hidden"><div class="card"><h3>月次交通費</h3><p class="muted" id="summaryMonth"></p><p class="muted">片道1回につき350円で集計</p><div id="totals"></div><button id="csv" class="primary" style="width:100%">CSVを書き出す（デモ）</button></div></section><script>
const people=['山田太郎','山田花子','佐藤健','鈴木愛','田中葵','高橋悠','小林凛','伊藤大輔'];const key='golf_preview_v1';let records=JSON.parse(localStorage.getItem(key)||'{}');let date=new Date(),direction='out',driver='',passengers=[];const $=id=>document.getElementById(id), iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, month=()=>iso(date).slice(0,7), recordKey=()=>`${$('date').value}|${direction}`;function save(){localStorage.setItem(key,JSON.stringify(records))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(tab){for(const t of ['calendar','rides','summary'])$(t).classList.toggle('hidden',t!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('date').value=iso(date);$('date').onchange=()=>{date=new Date($('date').value+'T12:00:00');render()};$('prev').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()-1,1);render()};$('next').onclick=()=>{date=new Date(date.getFullYear(),date.getMonth()+1,1);render()};for(const d of ['out','back'])$(d).onclick=()=>{direction=d;render()};function matches(id,callback){const q=$(id).value.trim();const root=$(id==='driverQuery'?'driverMatches':'passengerMatches');root.replaceChildren();if(!q)return;people.filter(n=>n.includes(q)).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.style.margin='4px';b.onclick=()=>{callback(n);$(id).value='';matches(id,callback);render()};root.appendChild(b)})}$('driverQuery').oninput=()=>matches('driverQuery',n=>driver=n);$('passengerQuery').oninput=()=>matches('passengerQuery',n=>{if(n!==driver&&!passengers.includes(n))passengers.push(n)});$('add').onclick=()=>{if(!driver)return alert('運転者を選択してください');let k=recordKey(),arr=records[k]||[];if(arr.some(a=>a.driver===driver))return alert('この運転者は登録済みです');arr.push({driver,passengers:[...passengers]});records[k]=arr;save();driver='';passengers=[];render()};function render(){const y=date.getFullYear(),m=date.getMonth();$('monthLabel').textContent=`${y}年${m+1}月`;$('summaryMonth').textContent=`${y}年${m+1}月`;const cal=$('cal');cal.replaceChildren();'日月火水木金土'.split('').forEach(w=>{const e=document.createElement('strong');e.className='day';e.textContent=w;cal.appendChild(e)});for(let i=0;i<new Date(y,m,1).getDay();i++)cal.appendChild(document.createElement('div'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const day=iso(new Date(y,m,d));const b=document.createElement('button');b.className='day'+(day===$('date').value?' selected':'')+((records[day+'|out']||records[day+'|back'])?' mark':'');b.textContent=d;b.onclick=()=>{$('date').value=day;date=new Date(day+'T12:00:00');show('rides')};cal.appendChild(b)}$('out').classList.toggle('active',direction==='out');$('back').classList.toggle('active',direction==='back');$('selectedPassengers').innerHTML='<p class="muted">運転者：'+esc(driver||'未選択')+'</p>'+passengers.map(p=>'<span class="pill">'+esc(p)+'</span>').join('');const box=$('assignments');box.replaceChildren();(records[recordKey()]||[]).forEach((a,i)=>{const el=document.createElement('div');el.className='assignment';const name=document.createElement('strong');name.textContent=a.driver+'車';const p=document.createElement('p');p.className='muted';p.textContent='乗車：'+(a.passengers.join('・')||'おひとりで');const b=document.createElement('button');b.className='remove';b.textContent='削除';b.onclick=()=>{records[recordKey()].splice(i,1);save();render()};el.append(name,p,b);box.appendChild(el)});if(!box.children.length)box.textContent='この方向の配車は未登録です';const totals={};Object.entries(records).forEach(([k,arr])=>{if(k.slice(0,7)!==month())return;arr.forEach(a=>totals[a.driver]=(totals[a.driver]||0)+1)});$('totals').innerHTML='<table><tr><th>運転者</th><th>回数</th><th>金額</th></tr>'+Object.entries(totals).map(([n,c])=>`<tr><td>${esc(n)}</td><td>${c}</td><td>${(c*350).toLocaleString()}円</td></tr>`).join('')+'</table>';}$('csv').onclick=()=>{const rows=[['氏名','片道回数','金額']];const t={};Object.entries(records).forEach(([k,arr])=>{if(k.slice(0,7)===month())arr.forEach(a=>t[a.driver]=(t[a.driver]||0)+1)});Object.entries(t).forEach(([n,c])=>rows.push([n,c,c*350]));const csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`demo_${month()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
