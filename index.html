<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>名大医学部ゴルフ部 | ログイン</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#18352c;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;min-height:100dvh;padding:38px 20px}header{text-align:center;margin:30px 0}.logo{font-size:38px}h1{font-size:22px;margin:10px 0 5px}p{color:#5e7369;font-size:14px;line-height:1.7}.panel{background:white;padding:25px 20px;border-radius:20px;box-shadow:0 7px 30px #18352c0d}label{display:block;font-weight:600;font-size:14px;margin:16px 0 7px}input{width:100%;border:1px solid #ccd8d1;border-radius:10px;padding:14px;font-size:16px}button{border:0;border-radius:10px;background:#176b4c;color:white;font-size:16px;font-weight:700;padding:15px;width:100%;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}.muted{font-size:12px;color:#63776b}.msg{margin-top:15px;white-space:pre-wrap;font-size:13px}.error{color:#ad2f2f}.ok{color:#176b4c}.tile{background:#f1f6f3;border-radius:12px;padding:15px;margin:12px 0}.hidden{display:none}.smallbtn{background:#e8f0eb;color:#225a42;margin-top:12px}footer{text-align:center;margin:25px 0;font-size:12px;color:#6b8074}</style></head><body><main><header><div class="logo">⛳</div><h1>名大医学部ゴルフ部</h1><p>部員専用ポータル・ログイン接続テスト</p></header><section id="login" class="panel"><h2>ログイン</h2><p>現在はSupabase接続確認のため、作成済みのテスト用メールアドレスでログインします。学籍番号方式は次の開発段階です。</p><form id="form"><label for="email">テスト用メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">ログイン</button></form><div id="loginMessage" class="msg" role="status"></div></section><section id="home" class="panel hidden"><h2 id="welcome">ログイン中</h2><p id="profile"></p><div class="tile">📅 カレンダー <span class="muted">（今後実装）</span></div><div class="tile">🚗 配車表 <span class="muted">（今後実装）</span></div><div class="tile">💴 練ラン報告・交通費 <span class="muted">（今後実装）</span></div><button id="logout" class="smallbtn">ログアウト</button><div id="homeMessage" class="msg" role="status"></div></section><footer>試験運用中：実際の学籍番号・誕生日・部員情報は入力しないでください。</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';
const URL='https://dbznarjkjangefykpkal.supabase.co';
const KEY='sb_publishable_aQedCu_y6RpgS9lL4StQgA_m0qV4fvl';
const login=document.getElementById('login'),home=document.getElementById('home'),form=document.getElementById('form'),msg=document.getElementById('loginMessage'),submit=document.getElementById('submit');
let client;
function message(el,text,err=false){el.textContent=text;el.className='msg '+(err?'error':'ok')}
if(!window.supabase){message(msg,'認証ライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。',true);submit.disabled=true;return}
client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
async function render(session){if(!session){login.classList.remove('hidden');home.classList.add('hidden');return}login.classList.add('hidden');home.classList.remove('hidden');document.getElementById('welcome').textContent='ログインできました！';document.getElementById('profile').textContent='部員プロフィールを確認中…';const {data,error}=await client.from('members').select('full_name,display_name,grade,role').eq('auth_user_id',session.user.id).maybeSingle();if(error){document.getElementById('profile').textContent='ログイン成功。ただし部員情報を取得できませんでした。';message(document.getElementById('homeMessage'),'プロフィール取得エラー: '+error.message,true);return}if(!data){document.getElementById('profile').textContent='ログイン成功。ただしこのアカウントに紐づく部員情報はありません。';return}document.getElementById('welcome').textContent=data.full_name+' さん';document.getElementById('profile').textContent=(data.grade?data.grade+'年生 ・ ':'')+(data.role==='accountant'?'会計係':'一般部員')+'としてログイン中';}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;message(msg,'ログインを確認中…');try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;document.getElementById('password').value='';message(msg,'');await render(data.session)}catch(err){message(msg,'ログインできませんでした。メールアドレスとパスワードを確認してください。'+(err.message?'\n'+err.message:''),true)}finally{submit.disabled=false}});
document.getElementById('logout').addEventListener('click',async()=>{const {error}=await client.auth.signOut();if(error){message(document.getElementById('homeMessage'),error.message,true);return}await render(null)});
client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>{render(session).catch(()=>{})},0)});
client.auth.getSession().then(({data,error})=>{if(error)message(msg,error.message,true);else render(data.session)}).catch(e=>message(msg,e.message,true));
})();</script></body></html>
