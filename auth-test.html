<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>会計係権限テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7f5;color:#163d2d;margin:0;padding:28px 16px}main{max-width:500px;margin:auto;background:white;padding:24px;border-radius:18px}button{background:#176b4c;color:white;border:0;border-radius:10px;padding:16px;width:100%;font-size:17px}pre{white-space:pre-wrap;word-break:break-word;background:#edf4ef;padding:14px;border-radius:10px}a{color:#176b4c}</style></head><body><main><h2>⛳ 会計係権限テスト</h2><p>Safariでテスト会計係としてログインした状態で、このページを開いてください。</p><p id="state">ログイン状態を確認中…</p><button id="run" disabled>認証テストを実行</button><pre id="result">結果はここに表示されます。</pre><p><a href="./">ゴルフ部アプリへ戻る</a></p><small>認証トークン・パスワードは画面に表示しません。部員データも変更しません。</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const url='https://dbznarjkjangefykpkal.supabase.co';
const key='sb_publishable_aQedCu_y6RpgS9lL4StQgA_m0qV4fvl';
const state=document.getElementById('state'),result=document.getElementById('result'),button=document.getElementById('run');
(async()=>{try{if(!window.supabase)throw Error('認証ライブラリを読み込めません');const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){state.textContent='ログインしていません。先にアプリでログインしてください。';return;}const {data:{user},error:userError}=await client.auth.getUser();if(userError||!user){state.textContent='ログインを再確認してください。';return;}state.textContent='ログイン状態を確認しました。';button.disabled=false;button.onclick=async()=>{button.disabled=true;result.textContent='確認中…';try{const {data,error}=await client.functions.invoke('manage-members',{body:{}});if(error){let status=error.context?.status||'不明';let detail='';try{detail=JSON.stringify(await error.context.json())}catch{}result.textContent='HTTP '+status+'\n'+(detail||error.message);return;}result.textContent='HTTP 200\n'+JSON.stringify(data,null,2);}catch(e){result.textContent='エラー: '+e.message}finally{button.disabled=false}}}catch(e){state.textContent='エラー: '+e.message}})();
</script></body></html>
