<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>部員管理 | 名大医学部ゴルフ部</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f3f6f4;color:#193d30;margin:0;padding:20px}main{max-width:700px;margin:auto}.panel{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 14px #183e2910}button{background:#176a4b;color:white;border:0;border-radius:10px;padding:13px 18px;font-size:16px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd7d0;border-radius:10px;font-size:16px}table{border-collapse:collapse;width:100%}th,td{padding:12px 7px;border-bottom:1px solid #e5ebe7;text-align:left;font-size:14px}th{color:#567468}small{color:#60766b}.error{color:#a12a2a}a{color:#176a4b}</style></head><body><main><h2>⛳ 名大医学部ゴルフ部</h2><small>会計係専用・部員一覧</small><section class="panel"><p id="status">ログイン状態を確認しています…</p><button id="reload" hidden>一覧を再読み込み</button></section><section class="panel" id="list" hidden><h3>部員一覧 <span id="count"></span></h3><input id="search" placeholder="氏名・表示名・学籍番号で検索"><div style="overflow-x:auto"><table><thead><tr><th>氏名</th><th>表示名</th><th>学年</th><th>在籍状態</th></tr></thead><tbody id="rows"></tbody></table></div></section><p><a href="./">アプリに戻る</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://dbznarjkjangefykpkal.supabase.co','sb_publishable_aQedCu_y6RpgS9lL4StQgA_m0qV4fvl');
const status=document.getElementById('status'), list=document.getElementById('list'), rows=document.getElementById('rows'), search=document.getElementById('search'), reload=document.getElementById('reload');let members=[];
function render(){const q=search.value.trim().toLowerCase();const found=members.filter(m=>[m.full_name,m.display_name,m.student_number].some(v=>String(v??'').toLowerCase().includes(q)));rows.replaceChildren();for(const m of found){const tr=document.createElement('tr');for(const val of [m.full_name,m.display_name,m.grade?`${m.grade}年`:'—',({active:'在籍',graduated:'卒業',withdrawn:'退部'})[m.member_status]??m.member_status??'—']){const td=document.createElement('td');td.textContent=val??'—';tr.append(td)}rows.append(tr)}document.getElementById('count').textContent=`（${found.length}名）`}
async function load(){list.hidden=true;reload.hidden=true;status.className='';status.textContent='ログイン状態を確認しています…';try{const {data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError||!session){status.textContent='ログインが必要です。先にトップページからログインしてください。';return}const {data:profile,error:profileError}=await supabase.from('members').select('role,member_status,active').eq('auth_user_id',session.user.id).single();if(profileError||!profile||profile.role!=='accountant'||profile.member_status!=='active'||profile.active!==true){status.textContent='会計係の権限が確認できません。';return}const {data,error}=await supabase.from('members').select('full_name,display_name,student_number,grade,member_status').order('grade',{ascending:false}).order('full_name');if(error)throw error;members=data??[];status.textContent='会計係として認証済み。部員一覧を表示しています。';list.hidden=false;reload.hidden=false;render()}catch(e){status.className='error';status.textContent='取得に失敗しました: '+(e?.message??'不明なエラー');reload.hidden=false}}
search.addEventListener('input',render);reload.addEventListener('click',load);load();
</script></body></html>
